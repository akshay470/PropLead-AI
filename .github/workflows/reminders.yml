name: Dispatch Site Visit Reminders

on:
  schedule:
    # Run every 15 minutes to process upcoming 24h and 2h site visit reminders
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allow manual triggers from GitHub Actions UI

jobs:
  dispatch-reminders:
    name: Trigger Cron Reminders Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Reminders Cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Cron skipped: APP_URL or CRON_SECRET not configured"
            exit 0
          fi

          curl --fail --max-time 30 \
            -X GET "$APP_URL/api/cron/reminders" \
            -H "Authorization: Bearer $CRON_SECRET"
