name: Dispatch Site Visit Reminders

on:
  schedule:
    # Run every 15 minutes to process upcoming 24h and 2h site visit reminders
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allow manual triggers from GitHub Actions UI

jobs:
  dispatch-reminders:
    name: Trigger Cron Reminders Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Call PropLead AI Reminders Cron API
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "Error: APP_URL secret is not configured"
            exit 1
          fi
          
          echo "Triggering reminders cron on ${{ secrets.APP_URL }}..."
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "${{ secrets.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          
          body=$(echo "$response" | sed -e '$d')
          status=$(echo "$response" | tail -n1 | cut -d':' -f2)
          
          echo "Response Status: $status"
          echo "Response Body: $body"
          
          if [ "$status" -ne 200 ]; then
            echo "Cron trigger failed with HTTP status $status"
            exit 1
          fi
